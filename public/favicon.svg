<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0f2535"/>

  <!-- Node 1 — Client (green) -->
  <rect x="8" y="2" width="16" height="7" rx="2" fill="#4ade80"/>

  <!-- Connector 1 → 2 -->
  <line x1="16" y1="9" x2="16" y2="11.5" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 10.5 L16 12.5 L18 10.5" stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 2 — Server (blue) -->
  <rect x="8" y="13" width="16" height="7" rx="2" fill="#60a5fa"/>

  <!-- Connector 2 → 3 -->
  <line x1="16" y1="20" x2="16" y2="22.5" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 21.5 L16 23.5 L18 21.5" stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 3 — Database (purple) -->
  <rect x="8" y="24" width="16" height="6" rx="2" fill="#c084fc"/>
</svg>
